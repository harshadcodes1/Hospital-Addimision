<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Admission Logic Checker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='design.css') }}">
</head>
<body>

<div class="box">
    <h2>🏥 Admission Logic Checker</h2>
    <p class="sub">Simple rule-based patient triage</p>

    <form method="POST">
        <label for="age">Age</label>
        <input type="number" id="age" name="age" min="0" max="120"
               value="{{ age if age is not none else '' }}" placeholder="e.g. 45" required>

        <label for="temp">Temperature (°F)</label>
        <input type="number" id="temp" name="temp" step="0.1"
               value="{{ temp if temp is not none else '' }}" placeholder="e.g. 101.5" required>

        <label for="severity">Symptom Severity</label>
        <select id="severity" name="severity">
            <option value="mild" {{ 'selected' if severity == 'mild' else '' }}>Mild</option>
            <option value="moderate" {{ 'selected' if severity == 'moderate' else '' }}>Moderate</option>
            <option value="severe" {{ 'selected' if severity == 'severe' else '' }}>Severe</option>
        </select>

        <button type="submit">Check Admission</button>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% elif result %}
        <div class="result {{ result.css_class }}">
            <span class="badge {{ result.css_class }}">{{ result.priority }}</span>
            <p><b>Recommended Ward:</b> {{ result.ward }}</p>
            <p><b>Reason:</b> {{ result.reason }}</p>
            <p><b>Estimated Bed Charge:</b> ₹{{ result.charge }} / day</p>
        </div>
    {% endif %}
</div>

</body>
</html>
